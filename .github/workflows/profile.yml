name: Profile

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: utajum/profile-readme-action@6102fafc1956fdfcb089693c11c43b677e8752aa
        with:
          # PAT with repo scope for private stats; without it the README stats are kept
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
          timezone: Europe/Skopje
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md profile-3d-contrib profile
          git diff --staged --quiet || git commit -m "generated"
          git push
